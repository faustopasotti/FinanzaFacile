
name: Crea APK Finanza Facile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepara Android
        uses: android-actions/setup-android@v3

      - name: Installa Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Crea il progetto Android
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/it/finanzafacile/app

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'FinanzaFacile'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'it.finanzafacile.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'it.finanzafacile.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '2.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Finanza Facile"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/it/finanzafacile/app/MainActivity.java <<'EOF'
          package it.finanzafacile.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("https".equals(scheme) ||
                              "http".equals(scheme)) {
                              try {
                                  startActivity(new Intent(
                                      Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Compila APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rendi disponibile APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanzaFacile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
